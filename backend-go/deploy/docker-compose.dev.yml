# 本地开发依赖：MySQL 8 + Redis Stack（缓存实例 + 控制实例）
#
# 缓存实例：allkeys-lru，允许被淘汰（丢了可从 MySQL 重建）
# 控制实例：noeviction + AOF，存 Bloom / 限流 / 黑名单，绝不能丢
#
# 用法：docker compose -f backend-go/deploy/docker-compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: tapiito-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500
      - --slow-query-log=1
      - --long-query-time=0.2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nfc
      MYSQL_USER: nfc_user
      MYSQL_PASSWORD: nfc_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis/redis-stack-server:latest
    container_name: tapiito-redis-cache
    command:
      - redis-stack-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-control:
    image: redis/redis-stack-server:latest
    container_name: tapiito-redis-control
    command:
      - redis-stack-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6380:6379"
    volumes:
      - redis-control-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-control-data:
