# Tapiito 入口层：公开域名与管理域名彻底隔离
#
# 关键点：
#   1. admin 域名单独 server 块，只反代 :8081，并强制 IP 白名单
#   2. 所有请求都覆盖 X-Real-IP（Go 侧只信这个头，不解析 X-Forwarded-For）
#   3. 公开入口限制请求体大小与连接数，挡住低成本洪水

limit_req_zone $binary_remote_addr zone=public_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=public_write:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream tapiito_public {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream tapiito_admin {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ---------- 公开入口 ----------
server {
    listen 80;
    server_name api.tapiito.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tapiito.com;

    ssl_certificate     /etc/nginx/certs/api.crt;
    ssl_certificate_key /etc/nginx/certs/api.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    limit_conn perip 20;

    # 屏蔽常见扫描 UA（低成本拦截，真正的防线在应用层限流）
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|acunetix)) {
        return 444;
    }

    location /api/public/ {
        limit_req zone=public_read burst=20 nodelay;
        proxy_pass http://tapiito_public;
        include /etc/nginx/proxy_params_tapiito.conf;
    }

    location /api/ {
        # 公开域名绝不把管理写接口转发出去
        return 404;
    }

    location /healthz {
        proxy_pass http://tapiito_public;
        access_log off;
    }
}

# ---------- 管理入口 ----------
server {
    listen 443 ssl http2;
    server_name admin.tapiito.com;

    ssl_certificate     /etc/nginx/certs/admin.crt;
    ssl_certificate_key /etc/nginx/certs/admin.key;

    client_max_body_size 16m;
    limit_conn perip 5;

    # 强烈建议：改成公司出口 IP 或 VPN 网段
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location /api/auth/loginAdmin {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://tapiito_admin;
        include /etc/nginx/proxy_params_tapiito.conf;
    }

    location /api/ {
        proxy_pass http://tapiito_admin;
        include /etc/nginx/proxy_params_tapiito.conf;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass http://tapiito_admin;
        access_log off;
    }
}
