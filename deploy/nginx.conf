 # Nginx 主配置：反向代理 Go 双入口 API 与前端静态资源
user  nginx;
 # 根据 CPU 自动选择工作进程数量
worker_processes  auto;
 # 错误日志位置与级别
error_log  /var/log/nginx/error.log warn;
 # 主进程 PID 文件
pid        /var/run/nginx.pid;

 # 事件模型配置：允许的最大并发连接数
events { worker_connections 1024; }

http {
  # 基础 HTTP 配置，启用常见 MIME 类型
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  client_max_body_size 16m;

  # 压缩：默认配置被整体覆盖后 gzip 是关闭的，必须显式打开。
  # 2.6MB 的 JS 压到约 600KB，跨境弱网下这是最关键的一项。
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;

  # 静态资源文件名带 hash，可放心长缓存，避免二次访问重复下载
  # （实际 location 在 server 内定义）

  # 两个固定 upstream：公开与管理分属不同端口。
  # 用 map 选「变量名」而非「主机名」，避免 proxy_pass 变量触发动态 DNS 解析。
  upstream public_api { server api:8080; }
  upstream admin_api  { server api:8081; }

  map "$request_method:$uri" $api_upstream {
    default                                    admin_api;
    "~^GET:/api/public/"                       public_api;
    "~^POST:/api/orders$"                      public_api;
    "~^POST:/api/feedback$"                    public_api;
    "~^GET:/api/feedback/adopted"              public_api;
  }

  # ---------- HTTPS 主站点 ----------
  server {
    listen 443 ssl;
    http2 on;
    server_name tapiito.com;

    ssl_certificate     /etc/letsencrypt/live/tapiito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapiito.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    location /uploads/ {
      proxy_pass http://public_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
      proxy_pass http://public_api;
      access_log off;
    }

    # 带 hash 的构建产物：一年强缓存
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # 展厅预览图：30 天缓存。只匹配图片文件——
    # /showroom 本身是前端路由，不能当成目录（会被 301 加斜杠并落进静态目录）
    location ~* ^/showroom/.+\.(jpg|jpeg|png|webp|avif|svg|gif)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }

  # ---------- HTTP: 域名访问一律 301 到 HTTPS ----------
  # ---------- www 统一 301 到裸域（SEO：避免同一内容两个域名分散权重） ----------
  server {
    listen 443 ssl;
    http2 on;
    server_name www.tapiito.com;

    ssl_certificate     /etc/letsencrypt/live/tapiito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapiito.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://tapiito.com$request_uri;
  }

  server {
    listen 80;
    server_name tapiito.com www.tapiito.com;
    return 301 https://$host$request_uri;
  }

  # ---------- HTTP: 默认站点（IP 直访等）走原代理 ----------
  server {
    listen 80 default_server;
    server_name _;

    # 反向代理后端 API：按上方 map 分流到公开或管理 upstream
    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # 覆盖客户端自带的同名头，Go 侧只信任这个值
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # 反向代理上传文件目录（始终走公开入口）
    location /uploads/ {
      proxy_pass http://public_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查直连公开入口
    location = /healthz {
      proxy_pass http://public_api;
      access_log off;
    }

    # 前端静态页面：优先命中文件与目录，未命中回退到单页应用入口
    # 带 hash 的构建产物：一年强缓存
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # 展厅预览图：30 天缓存。只匹配图片文件——
    # /showroom 本身是前端路由，不能当成目录（会被 301 加斜杠并落进静态目录）
    location ~* ^/showroom/.+\.(jpg|jpeg|png|webp|avif|svg|gif)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
