    <noscript>
      <h1>Tapiito 智能 NFC 标签</h1>
      <p>
        Tapiito 是一张薄薄的 NFC 智能标签。手机碰一碰，即可展示数字名片、门店菜单、作品集或紧急联系信息。
        内置 30+ 设计风格，支持暗号保护与一次性链接，内容可重复改写，无需供电。
      </p>

      <h2>NFC 标签是什么</h2>
      <p>
        NFC 是近场通信（Near Field Communication）的缩写，工作在 13.56MHz，和公交卡、门禁卡是同一类技术，
        区别在于标签里可以写入一个网址。Tapiito 标签内部是一颗带天线的芯片，不需要电池也不需要充电：
        手机靠近时，手机发出的电磁场给芯片供电，芯片把网址回传给手机，浏览器随即打开页面，全程通常在半秒内完成。
      </p>
      <p>
        与二维码相比，NFC 不需要对准、不需要光线、不怕磨损污损。二维码印在纸上一旦淋湿、折皱或被覆盖就读不出来；
        NFC 标签可以封装在 PVC 卡片、亚克力牌、金属铭牌里，在户外、厨房、宠物项圈等场景下依然稳定。
        iPhone 7 及之后机型、绝大多数安卓中高端机型都支持，iOS 14 起可直接在后台读取，无需打开 App。
      </p>

      <h2>九种标签，分别适合什么场景</h2>
      <h3>商务名片</h3>
      <p>
        碰一下展示姓名、职位、公司、电话、邮箱、网站和微信号，访客可直接保存到手机通讯录。
        适合销售、设计师、咨询顾问、创业者，以及任何需要频繁交换联系方式的人。
      </p>
      <h3>门店菜单</h3>
      <p>
        贴在餐桌角或门口，顾客碰一下看到菜品、价格、图片与推荐。相比桌贴二维码不用对准、不怕油污水渍，
        翻台时也无需反复擦拭。适合餐厅、咖啡馆、酒吧、茶室。
      </p>
      <h3>企业官网</h3>
      <p>
        把公司介绍、产品线、联系方式、地图位置浓缩成碰触即开的页面。适合展会、招商会、门店前台，
        替代厚重宣传册，内容随时可改，不必重印。
      </p>
      <h3>产品展示</h3>
      <p>
        贴在实物旁，碰一下看到参数、使用方法、售后说明与购买链接。适合数码产品、家电、家具、手工作品，降低导购解释成本。
      </p>
      <h3>夜店交际</h3>
      <p>
        带暗号保护的一类。只有知道当晚暗号的人能打开，且链接一次性使用、转发无效。
        适合酒吧、夜店、派对场景下有限度地交换联系方式。
      </p>
      <h3>求助信息卡</h3>
      <p>
        给独居老人、慢病患者、语言不通的旅行者使用。路人碰一下即可看到紧急联系人、病史、用药禁忌与过敏源，并可直接拨号。
        支持上传现场照片与留言反馈。
      </p>
      <h3>宠物铭牌</h3>
      <p>
        挂在项圈上，捡到宠物的人碰一下即能看到宠物名字、主人电话与走失酬谢说明。
        相比刻字吊牌，信息可随时更新，也不受字数限制。
      </p>
      <h3>儿童信息卡</h3>
      <p>
        放在书包、校服内袋或手环上。走失时旁人碰一下即可联系家长，可标注过敏史与接送人信息，内容仅监护人可改。
      </p>
      <h3>菜谱</h3>
      <p>
        贴在厨房台面或食材包装上，碰一下看到分步做法、火候时间与食材用量。适合私厨、烘焙工作室、食品品牌做延伸内容。
      </p>

      <h2>关于隐私与访问控制</h2>
      <p>
        每一枚标签都可单独设置访问权限：完全公开、暗号保护、一次性链接、暗号加一次性链接。
        夜店场景通常用「暗号 + 一次性链接」，只有知道暗号的人能打开，转发出去的链接在对方手机上打不开；
        求助卡与宠物铭牌用「一次性链接 + 角标水印」，保证任何善意路人都能第一时间扫开，同时水印防止截图外传；
        商务名片建议直接用公开模式，扫码即看。
      </p>
      <p>
        暗号在服务器上以 bcrypt 哈希形式存储，不保存明文。同一 IP 或同一标签连续输错三次会锁定三十分钟，防止暴力尝试。
      </p>

      <h2>常见问题</h2>
      <h3>我的手机支持 NFC 吗</h3>
      <p>
        iPhone 7 及之后机型都支持，iOS 14 起可直接后台读取。安卓方面绝大多数中高端机型（华为、小米、OPPO、vivo、三星等）支持，
        可在设置里搜索「NFC」确认。少数入门机型不支持时，可用标签背面的二维码作为备选。
      </p>
      <h3>需要装 App 或充电吗</h3>
      <p>都不需要。标签是被动式芯片，靠手机电磁场供电，没有电池也不会没电；访客也不需要安装任何 App。</p>
      <h3>内容以后想改怎么办</h3>
      <p>在后台修改即可，保存后立即生效，不用重新买标签。每枚标签含 1 次免费内容调整。</p>
      <h3>能贴在金属表面吗</h3>
      <p>
        普通标签贴在金属上会被干扰，读取距离明显缩短。如果使用场景是金属表面（冰箱、机箱、金属工牌），下单时备注，
        我们会提供抗金属专用标签。
      </p>
      <h3>能用多久，会消磁吗</h3>
      <p>
        NFC 标签没有磁性、不会消磁，数据写入后可保存十年以上。物理寿命取决于封装：PVC 卡片日常使用三到五年没问题，
        户外场景建议选防水封装的亚克力牌或金属牌。
      </p>
      <h3>别人能改我的标签内容吗</h3>
      <p>
        不会。出厂时标签会被设为只读锁定，写入后任何设备都无法覆盖。只有你在后台修改内容时页面才会更新，
        因为标签里存的是固定网址，内容由服务器下发。
      </p>
      <h3>一次性链接转发真的会失效吗</h3>
      <p>
        每次打开都会校验凭证，凭证首次使用时绑定到当前浏览器会话。自己刷新没问题，但把链接发给别人，
        对方浏览器没有对应会话就会提示链接已失效。
      </p>
      <h3>发货要多久</h3>
      <p>内容确认后一般一到两个工作日内发出。定制款（刻字、异形、金属牌）需要三到五个工作日。</p>

      <p>请启用 JavaScript 以获得完整体验。</p>
